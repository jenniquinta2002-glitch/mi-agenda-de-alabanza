<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6f4e37">
<title>Mi Agenda de Alabanza</title>
<style>
:root{--cream:#fbf7ef;--paper:#fffdf8;--ink:#392c24;--muted:#817267;--gold:#b58a4b;--goldlight:#f1e4cd;--brown:#6f4e37;--line:#e9dfd1;--green:#6c7c62;--rose:#b97868}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:88px}
button,input,textarea,select{font:inherit}button{cursor:pointer}
header{padding:24px 18px 20px;background:linear-gradient(135deg,#6f4e37,#987451);color:#fffdf8;border-radius:0 0 28px 28px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;opacity:.85}.brand{font-family:Georgia,serif;font-size:1.65rem;margin:5px 0}.sub{font-size:.88rem;opacity:.88;margin:0}.roundbtn{border:1px solid #ffffff55;background:#ffffff18;color:white;border-radius:14px;padding:10px}
main{max-width:780px;margin:auto;padding:18px 14px}.view{display:none}.view.active{display:block}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 2px 14px}.sectionhead h2{font:1.45rem Georgia,serif;margin:0}.muted{color:var(--muted);font-size:.88rem}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:13px;box-shadow:0 4px 14px #50341a08}.hero{background:#f1e4cd;border-color:#ead7b7}.hero h3{font:1.25rem Georgia,serif;margin:4px 0 8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 10px}.stat strong{font-size:1.35rem;display:block}.stat span{font-size:.75rem;color:var(--muted)}
.btn{border:0;background:var(--brown);color:white;border-radius:13px;padding:11px 14px;font-weight:650}.btn.light{background:var(--goldlight);color:var(--brown)}.btn.outline{background:transparent;color:var(--brown);border:1px solid var(--line)}.btn.small{padding:8px 10px;font-size:.84rem}.btn.danger{background:#f7e7e3;color:#8b382c}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}.field label{font-size:.84rem;font-weight:650;color:#665346}.field input,.field textarea,.field select,.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);outline-color:var(--gold)}textarea{min-height:100px;resize:vertical}.field textarea.lyrics{min-height:230px;white-space:pre-wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#f1e4cd;color:#6f4e37;font-size:.75rem;margin:3px 4px 3px 0}.listrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.listrow h3{font-size:1rem;margin:0 0 4px}.listrow p{margin:4px 0}.empty{text-align:center;padding:28px 15px;color:var(--muted)}.empty .symbol{font-size:2rem}.nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8f2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{background:none;border:0;color:#89796d;font-size:.68rem;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 5px;min-width:54px}.nav button .ico{font-size:1.25rem}.nav button.active{color:var(--brown);font-weight:750}.nav button.active .ico{background:var(--goldlight);border-radius:10px;padding:2px 10px}.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.monthbar button{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 12px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dow{text-align:center;color:var(--muted);font-size:.68rem;padding:5px 0}.day{min-height:54px;border:1px solid var(--line);border-radius:10px;background:#fffdf8;position:relative;padding:7px 3px 5px;text-align:center;color:var(--ink)}.day.blank{background:transparent;border-color:transparent}.day.service{border-color:#d8bd91;background:#fbf1df;font-weight:750}.day.selected{outline:2px solid var(--brown)}.day .dot{width:5px;height:5px;background:var(--green);border-radius:50%;position:absolute;bottom:5px;left:calc(50% - 2px)}.day small{display:block;font-size:.58rem;color:var(--muted);margin-top:3px}.toolbar{display:flex;gap:8px;align-items:center;margin:10px 0}.toolbar .search{flex:1}.checklist label{display:flex;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.checklist input{accent-color:var(--brown);width:18px;height:18px}.songtext{white-space:pre-wrap;line-height:1.8;font-size:1rem}.hidden{display:none!important}.notice{background:#edf1e8;border:1px solid #dce5d4;border-radius:13px;padding:12px;font-size:.85rem;color:#42543a}.smalltext{font-size:.78rem;color:var(--muted)}.songitem{padding:12px 0;border-bottom:1px solid var(--line)}.songitem:last-child{border:0}.fav{color:#a66e24;font-size:1.1rem}.footer-note{text-align:center;color:var(--muted);font-size:.75rem;margin:22px 0}
@media(min-width:650px){main{padding:24px}.day{min-height:68px}.brand{font-size:1.9rem}}
</style>
</head>
<body>
<header>
 <div class="topline"><div><div class="eyebrow">Tu espacio de servicio</div><div class="brand">Mi Agenda de Alabanza</div><p class="sub">Prepara el corazón. Organiza la alabanza.</p></div><button class="roundbtn" onclick="openBackup()" aria-label="Copias de seguridad">↥</button></div>
